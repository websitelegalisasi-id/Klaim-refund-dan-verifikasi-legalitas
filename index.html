<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistem Manajemen Keuangan Profesional Las Vegas">
    <title>Las Vegas Finance | Enterprise Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-app: #f1f5f9;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --radius: 12px;
            --shadow-soft: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            padding-bottom: 100px;
            -webkit-tap-highlight-color: transparent;
        }

        /* Upgrade Header */
        .header {
            background: var(--primary);
            padding: 2rem 1.5rem 5rem;
            color: white;
            border-radius: 0 0 30px 30px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .brand h1 { font-size: 1.5rem; letter-spacing: 1px; font-weight: 800; }
        .brand p { font-size: 0.75rem; opacity: 0.7; }

        /* Floating Summary Card */
        .summary-wrapper {
            max-width: 800px;
            margin: -3.5rem auto 2rem;
            padding: 0 1rem;
        }

        .main-card {
            background: var(--surface);
            border-radius: 24px;
            padding: 1.5rem;
            shadow: var(--shadow-soft);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        .balance-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .balance-value { font-size: 2.2rem; font-weight: 800; color: var(--primary); margin: 0.2rem 0; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #e2e8f0;
        }

        .stat-box { padding: 0.5rem; }
        .stat-box small { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; }
        .stat-box div { font-size: 1.1rem; font-weight: 700; }

        /* UI Components */
        .container { max-width: 800px; margin: 0 auto; padding: 0 1rem; }
        
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-soft);
        }

        .form-label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main); }
        
        input, select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }

        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .btn {
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: 0.2s;
        }

        .btn-primary { background: var(--accent); color: white; padding: 1rem; width: 100%; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Transaction List */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: white;
            border-radius: 12px;
            margin-bottom: 0.75rem;
            border-left: 4px solid #cbd5e1;
        }

        .item.in { border-left-color: var(--success); }
        .item.out { border-left-color: var(--danger); }
        .item.debt { border-left-color: var(--warning); }

        .item-info h4 { font-size: 0.95rem; font-weight: 700; color: var(--primary); }
        .item-info span { font-size: 0.75rem; color: var(--text-muted); }

        .item-amount { text-align: right; }
        .item-amount .val { font-weight: 800; font-size: 1rem; }

        /* Bottom Nav */
        .nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 0.8rem 0 1.5rem;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            z-index: 100;
        }

        .nav-link { color: var(--text-muted); text-decoration: none; text-align: center; font-size: 0.7rem; font-weight: 700; }
        .nav-link.active { color: var(--accent); }
        .nav-link i { font-size: 1.2rem; display: block; margin-bottom: 4px; }

        @media (max-width: 480px) {
            .balance-value { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-top">
            <div class="brand">
                <h1>LAS VEGAS</h1>
                <p id="live-clock">Finance Management System</p>
            </div>
            <button class="btn" style="background: rgba(255,255,255,0.1); color: white; padding: 0.5rem 1rem;" onclick="generatePDF()">
                <i class="fas fa-file-export"></i> PDF
            </button>
        </div>
    </header>

    <div class="summary-wrapper">
        <div class="main-card">
            <div class="balance-label">Total Saldo Kas</div>
            <div class="balance-value" id="display-total">Rp 0</div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <small>PEMASUKAN</small>
                    <div style="color: var(--success)" id="display-in">Rp 0</div>
                </div>
                <div class="stat-box">
                    <small>PENGELUARAN</small>
                    <div style="color: var(--danger)" id="display-out">Rp 0</div>
                </div>
                <div class="stat-box">
                    <small>PIUTANG AKTIF</small>
                    <div style="color: var(--warning)" id="display-debt">Rp 0</div>
                </div>
                <div class="stat-box">
                    <small>ESTIMASI NETTO</small>
                    <div id="display-net" style="color: var(--primary)">Rp 0</div>
                </div>
            </div>
        </div>
    </div>

    <main class="container">
        <div id="view-home" class="view">
            <div class="card">
                <form id="financeForm">
                    <input type="hidden" id="edit-id">
                    
                    <label class="form-label">Kategori</label>
                    <select id="type" required>
                        <option value="in">Kas Masuk (Pendapatan)</option>
                        <option value="out">Kas Keluar (Biaya)</option>
                        <option value="debt">Piutang (Barang/Jasa)</option>
                    </select>

                    <label class="form-label">Keterangan Transaksi</label>
                    <input type="text" id="desc" placeholder="Contoh: Penjualan Barang A" required>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label class="form-label">Tanggal</label>
                            <input type="date" id="date" required>
                        </div>
                        <div>
                            <label class="form-label">Nominal (Rp)</label>
                            <input type="number" id="amount" placeholder="0" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submit-btn">
                        <i class="fas fa-check-circle"></i> Simpan Data
                    </button>
                </form>
            </div>

            <div class="list-header">
                <h3 style="font-size: 1rem">Aktivitas Terbaru</h3>
                <input type="text" id="searchBar" placeholder="Cari transaksi..." style="width: 150px; margin-bottom: 0; padding: 0.4rem 0.8rem; font-size: 0.8rem;">
            </div>
            
            <div id="transaction-list">
                </div>
        </div>
    </main>

    <nav class="nav">
        <a href="#" class="nav-link active" onclick="showView('home')">
            <i class="fas fa-home"></i>Dashboard
        </a>
        <a href="#" class="nav-link" onclick="downloadBackup()">
            <i class="fas fa-database"></i>Backup
        </a>
        <a href="#" class="nav-link" onclick="wipeData()">
            <i class="fas fa-sync-alt"></i>Reset
        </a>
    </nav>

    <script>
        // Data Management
        let db = JSON.parse(localStorage.getItem('lv_pro_db')) || { logs: [] };
        
        const fmtr = new Intl.NumberFormat('id-ID');
        const formatIDR = (v) => "Rp " + fmtr.format(v);

        // Update Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').textContent = now.toLocaleTimeString('id-ID', {
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            }) + " | Las Vegas Enterprise";
        }
        setInterval(updateClock, 1000);

        // Form Logic
        const form = document.getElementById('financeForm');
        document.getElementById('date').valueAsDate = new Date();

        form.onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const entry = {
                id: id ? parseInt(id) : Date.now(),
                type: document.getElementById('type').value,
                desc: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                date: document.getElementById('date').value
            };

            if (id) {
                const idx = db.logs.findIndex(x => x.id == id);
                db.logs[idx] = entry;
            } else {
                db.logs.unshift(entry);
            }

            saveAndRender();
            form.reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('submit-btn').innerHTML = '<i class="fas fa-check-circle"></i> Simpan Data';
            document.getElementById('date').valueAsDate = new Date();
        };

        function saveAndRender() {
            localStorage.setItem('lv_pro_db', JSON.stringify(db));
            render();
        }

        function render() {
            const list = document.getElementById('transaction-list');
            const term = document.getElementById('searchBar').value.toLowerCase();
            list.innerHTML = '';

            let totalIn = 0, totalOut = 0, totalDebt = 0;

            db.logs.filter(item => item.desc.toLowerCase().includes(term)).forEach(item => {
                const isInc = item.type === 'in';
                const isDebt = item.type === 'debt';
                
                if(isInc) totalIn += item.amount;
                else if(isDebt) totalDebt += item.amount;
                else totalOut += item.amount;

                list.innerHTML += `
                    <div class="item ${item.type}">
                        <div class="item-info">
                            <h4>${item.desc}</h4>
                            <span>${item.date} • ${item.type.toUpperCase()}</span>
                        </div>
                        <div class="item-amount">
                            <div class="val" style="color: ${isInc ? 'var(--success)' : isDebt ? 'var(--warning)' : 'var(--danger)'}">
                                ${isInc ? '+' : isDebt ? '' : '-'} ${formatIDR(item.amount)}
                            </div>
                            <div style="margin-top: 5px">
                                <small onclick="editItem(${item.id})" style="cursor:pointer; color: var(--accent); font-weight:700">EDIT</small>
                                <small onclick="deleteItem(${item.id})" style="cursor:pointer; color: var(--danger); font-weight:700; margin-left:10px">HAPUS</small>
                            </div>
                        </div>
                    </div>
                `;
            });

            const currentKas = totalIn - totalOut;
            document.getElementById('display-total').textContent = formatIDR(currentKas);
            document.getElementById('display-in').textContent = formatIDR(totalIn);
            document.getElementById('display-out').textContent = formatIDR(totalOut);
            document.getElementById('display-debt').textContent = formatIDR(totalDebt);
            document.getElementById('display-net').textContent = formatIDR(currentKas - totalDebt);
        }

        function editItem(id) {
            const item = db.logs.find(x => x.id == id);
            document.getElementById('edit-id').value = item.id;
            document.getElementById('type').value = item.type;
            document.getElementById('desc').value = item.desc;
            document.getElementById('amount').value = item.amount;
            document.getElementById('date').value = item.date;
            document.getElementById('submit-btn').innerHTML = '<i class="fas fa-sync"></i> Update Data';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteItem(id) {
            if(confirm('Hapus transaksi ini?')) {
                db.logs = db.logs.filter(x => x.id != id);
                saveAndRender();
            }
        }

        function downloadBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `Backup_LasVegas_${new Date().toLocaleDateString()}.json`);
            dlAnchorElem.click();
        }

        function wipeData() {
            if(confirm('Hapus seluruh data? Pastikan Anda sudah backup.')) {
                db = { logs: [] };
                saveAndRender();
            }
        }

        document.getElementById('searchBar').oninput = render;

        // Init
        render();
    </script>
</body>
</html>
