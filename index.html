<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Las Vegas ERP | Precision Accounting v6.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #0f172a; --accent: #2563eb; --success: #10b981;
            --danger: #ef4444; --warning: #f59e0b; --bg-app: #f1f5f9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-app); color: #1e293b; padding-bottom: 120px; }
        
        .header { background: var(--primary); padding: 3rem 1rem 7rem; color: white; border-radius: 0 0 40px 40px; text-align: center; }
        .wrapper { max-width: 1100px; margin: -5rem auto 0; padding: 0 1rem; }
        
        /* Dashboard Premium */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        .stat-card::after { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); }
        .stat-card.success::after { background: var(--success); }
        .stat-card.danger::after { background: var(--danger); }
        .stat-card small { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .val { font-size: 1.6rem; font-weight: 800; margin-top: 5px; color: var(--primary); }

        /* Form Card */
        .main-card { background: white; border-radius: 24px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 8px; color: var(--primary); text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 14px; margin-bottom: 15px; transition: 0.3s; }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        
        .btn { padding: 15px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-save { background: var(--accent); color: white; width: 100%; font-size: 16px; }
        .btn-save:hover { background: #1d4ed8; transform: translateY(-2px); }

        /* Log Styling */
        .log-item { background: white; padding: 1.2rem; border-radius: 18px; margin-bottom: 0.8rem; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #cbd5e1; }
        .log-item.JUAL { border-left-color: var(--success); }
        .log-item.MODAL { border-left-color: var(--accent); }
        .log-item.OPS { border-left-color: var(--danger); }
        .log-item.PINJAM { border-left-color: var(--warning); }
        .log-item.TAGIHAN { border-left-color: #6366f1; }

        /* Navigation */
        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 1rem 0 2rem; border-top: 1px solid #e2e8f0; z-index: 100; }
        .nav-item { font-size: 11px; font-weight: 800; text-align: center; cursor: pointer; color: #64748b; }
        .nav-item i { font-size: 22px; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <header class="header">
        <h1 style="letter-spacing: 4px; font-weight: 800;">LAS VEGAS</h1>
        <p id="current-date-display" style="font-size: 12px; opacity: 0.7; letter-spacing: 2px;"></p>
    </header>

    <div class="wrapper">
        <div class="dashboard">
            <div class="stat-card">
                <small>Saldo Kas Fisik (Cash)</small>
                <div class="val" id="net-cash" style="color: var(--accent);">Rp 0</div>
            </div>
            <div class="stat-card success">
                <small>Laba/Rugi Hari Ini</small>
                <div class="val" id="net-profit">Rp 0</div>
            </div>
            <div class="stat-card danger">
                <small>Utang Barang (Kewajiban)</small>
                <div class="val" id="sum-tagihan">Rp 0</div>
            </div>
        </div>

        <div class="main-card">
            <form id="lvForm">
                <input type="hidden" id="edit-id">
                <div class="form-grid">
                    <div>
                        <label>PIC / Identitas</label>
                        <select id="person"><option>MD</option><option>RJ</option><option>ED</option><option>OPERASIONAL</option></select>
                    </div>
                    <div>
                        <label>Kategori Laporan</label>
                        <select id="category">
                            <option value="JUAL">📦 PENJUALAN (Pemasukan)</option>
                            <option value="MODAL">💰 MODAL (Setoran/Debit)</option>
                            <option value="OPS">💸 OPERASIONAL (Pengeluaran)</option>
                            <option value="PINJAM">🏦 PINJAMAN (Piutang Personel)</option>
                            <option value="TAGIHAN">⚠️ UTANG BARANG (Belum Lunas)</option>
                            <option value="NOTE">📝 CATATAN / INFO BARANG</option>
                        </select>
                    </div>
                </div>
                
                <label>Rincian Deskripsi</label>
                <textarea id="desc" rows="2" placeholder="Contoh: Beli ecer, Sarapan, Komit MD, atau Sisa Bayar 5 Unit..." required></textarea>
                
                <div class="form-grid">
                    <div><label>Tanggal Transaksi</label><input type="date" id="date" required></div>
                    <div><label>Nominal Rupiah (Rp)</label><input type="number" id="amount" placeholder="0" required></div>
                </div>
                
                <button type="submit" class="btn btn-save"><i class="fas fa-check-double"></i> VALIDASI & SIMPAN</button>
            </form>
        </div>

        <div id="log-list"></div>
    </div>

    <nav class="nav">
        <div class="nav-item" onclick="generatePDF()"><i class="fas fa-file-pdf"></i>PDF</div>
        <div class="nav-item" onclick="downloadBackup()"><i class="fas fa-cloud-download-alt"></i>BACKUP</div>
        <div class="nav-item" onclick="wipeData()" style="color:var(--danger)"><i class="fas fa-sync-alt"></i>RESET</div>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('lv_v6_db')) || { logs: [] };
        const formatIDR = (v) => "Rp " + new Intl.NumberFormat('id-ID').format(v);
        document.getElementById('date').valueAsDate = new Date();
        document.getElementById('current-date-display').textContent = new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});

        document.getElementById('lvForm').onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const entry = {
                id: id ? parseInt(id) : Date.now(),
                person: document.getElementById('person').value,
                cat: document.getElementById('category').value,
                desc: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value) || 0,
                date: document.getElementById('date').value
            };
            if(id) {
                const idx = db.logs.findIndex(x => x.id == id);
                db.logs[idx] = entry;
            } else { db.logs.unshift(entry); }
            localStorage.setItem('lv_v6_db', JSON.stringify(db));
            location.reload();
        };

        function render() {
            const list = document.getElementById('log-list');
            let modal=0, jual=0, ops=0, pinjam=0, utang=0;

            db.logs.forEach(i => {
                if(i.cat === 'MODAL') modal += i.amount;
                if(i.cat === 'JUAL') jual += i.amount;
                if(i.cat === 'OPS') ops += i.amount;
                if(i.cat === 'PINJAM') pinjam += i.amount;
                if(i.cat === 'TAGIHAN') utang += i.amount;

                list.innerHTML += `
                    <div class="log-item ${i.cat}">
                        <div>
                            <small style="font-weight:800; color:#64748b">${i.cat} | ${i.person}</small>
                            <h4 style="font-size:14px; margin-top:3px; text-transform:uppercase;">${i.desc}</h4>
                            <small>${i.date}</small>
                        </div>
                        <div style="text-align:right">
                            <div style="font-weight:800; font-size:15px; color:${(i.cat=='JUAL'||i.cat=='MODAL')?'var(--success)':'var(--primary)'}">${formatIDR(i.amount)}</div>
                            <div style="margin-top:5px">
                                <i class="fas fa-edit" onclick="editItem(${i.id})" style="cursor:pointer; color:var(--accent); margin-right:15px"></i>
                                <i class="fas fa-trash" onclick="deleteItem(${i.id})" style="cursor:pointer; color:var(--danger)"></i>
                            </div>
                        </div>
                    </div>`;
            });

            // LOGIKA KALKULASI AKURAT
            // Kas Fisik = (Modal Terbayar + Penjualan) - (Operasional + Pinjaman Keluar)
            document.getElementById('net-cash').textContent = formatIDR((modal + jual) - (ops + pinjam));
            // Profit = Penjualan - Operasional
            document.getElementById('net-profit').textContent = formatIDR(jual - ops);
            // Utang = Sisa pembayaran barang
            document.getElementById('sum-tagihan').textContent = formatIDR(utang);
        }

        function editItem(id) {
            const i = db.logs.find(x => x.id == id);
            document.getElementById('edit-id').value = i.id;
            document.getElementById('person').value = i.person;
            document.getElementById('category').value = i.cat;
            document.getElementById('desc').value = i.desc;
            document.getElementById('amount').value = i.amount;
            document.getElementById('date').value = i.date;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function deleteItem(id) {
            if(confirm('Hapus selamanya?')) {
                db.logs = db.logs.filter(x => x.id != id);
                localStorage.setItem('lv_v6_db', JSON.stringify(db));
                location.reload();
            }
        }

        function generatePDF() {
            const element = document.createElement('div');
            element.style.padding = '40px';
            const sections = [
                { title: "I. MODAL & PENJUALAN (TOTAL INCOME)", cats: ["MODAL", "JUAL"], color: "#10b981" },
                { title: "II. OPERASIONAL & KOMITMEN (TOTAL EXPENSE)", cats: ["OPS"], color: "#ef4444" },
                { title: "III. PINJAMAN / PIUTANG PERSONEL", cats: ["PINJAM"], color: "#f59e0b" },
                { title: "IV. KEWAJIBAN UTANG BARANG", cats: ["TAGIHAN"], color: "#6366f1" },
                { title: "V. CATATAN & URAIAN BARANG", cats: ["NOTE"], color: "#475569" }
            ];

            let html = `<h1 style="text-align:center; border-bottom:3px solid #000; padding-bottom:10px;">LAS VEGAS FINANCIAL REPORT</h1>
                        <table style="width:100%; border:2px solid #000; margin:20px 0; border-collapse:collapse;">
                            <tr style="background:#f1f5f9">
                                <th style="border:1px solid #000; padding:10px;">CASH ON HAND</th>
                                <th style="border:1px solid #000; padding:10px;">TOTAL PROFIT</th>
                                <th style="border:1px solid #000; padding:10px;">TOTAL UTANG</th>
                            </tr>
                            <tr style="text-align:center; font-size:16px; font-weight:bold;">
                                <td style="border:1px solid #000; padding:10px;">${document.getElementById('net-cash').textContent}</td>
                                <td style="border:1px solid #000; padding:10px; color:green;">${document.getElementById('net-profit').textContent}</td>
                                <td style="border:1px solid #000; padding:10px; color:red;">${document.getElementById('sum-tagihan').textContent}</td>
                            </tr>
                        </table>`;

            sections.forEach(sec => {
                const logs = db.logs.filter(l => sec.cats.includes(l.cat));
                html += `<h3 style="background:${sec.color}; color:#fff; padding:8px; font-size:13px; margin-top:20px;">${sec.title}</h3>
                         <table style="width:100%; border-collapse:collapse; font-size:10px;">
                            <tr style="background:#eee;">
                                <th style="border:1px solid #000; padding:8px; text-align:left;">TANGGAL</th>
                                <th style="border:1px solid #000; padding:8px;">PIC</th>
                                <th style="border:1px solid #000; padding:8px; text-align:left;">DESKRIPSI</th>
                                <th style="border:1px solid #000; padding:8px; text-align:right;">NOMINAL</th>
                            </tr>
                            ${logs.map(l => `<tr>
                                <td style="border:1px solid #000; padding:8px;">${l.date}</td>
                                <td style="border:1px solid #000; padding:8px; text-align:center; font-weight:bold;">${l.person}</td>
                                <td style="border:1px solid #000; padding:8px;">${l.desc.toUpperCase()}</td>
                                <td style="border:1px solid #000; padding:8px; text-align:right; font-weight:bold;">${formatIDR(l.amount)}</td>
                            </tr>`).join('')}
                         </table>`;
            });

            element.innerHTML = html;
            html2pdf().from(element).set({ margin:10, filename:'LV_Precision_Report.pdf', html2canvas:{scale:2} }).save();
        }

        function downloadBackup() {
            const blob = new Blob([JSON.stringify(db)], {type:'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `LV_DATABASE_V6.json`;
            a.click();
        }

        function wipeData() { if(confirm('Reset semua data?')) { localStorage.clear(); location.reload(); } }

        render();
    </script>
</body>
</html>
